# 合并到 main 后自动发布到 Cloudflare Pages（项目 kronword → https://kronword.pages.dev/）
# 用 scripts/build-site.sh 打包（带登录门禁 functions/），和手动发布完全一样。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（权限：Account → Cloudflare Pages → Edit）和 CLOUDFLARE_ACCOUNT_ID；没配 token 时跳过发布。
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-kronword
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-site.sh
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy dist --project-name kronword --branch main --commit-hash "$GITHUB_SHA"
      - name: No token yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN 还没配，这次没有发布"
