<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kron Word</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
</head><body>
<style>
/* Layout: one-screen game column — conveyor belt on top, brick workbench in the middle, match tray at the bottom */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EDEFF4; --fg:#1B1D25; --muted:#6A6F80; --line:#DCDFE7;
  --kron:#30C25B; --kron-d:#23964A;
  --logo:#1D1D1F; --skin:#FFDCC0; --skin-d:#F4BE98; --hair:#2B2320; --frame:#1B1D25; --mouth:#8A2E1E;
  --ok:#30C25B; --ok-d:#23964A; --bad:#FF4B4B;
  --rail:#2A2E38; --rail-2:#363B48; --rail-edge:#191C23;
  --berry:#FF3B7F; --berry-d:#C9295F; --sky:#1CB0F6; --sky-d:#0F87C0;
  --grape:#9B5CF6; --grape-d:#7639D6; --mint:#00C2A8; --mint-d:#00937F;
  --shadow:0 1px 0 rgba(20,24,40,.04), 0 14px 40px -20px rgba(20,24,40,.28);
  --font-display:"Fredoka", ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
  --font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1116; --surface:#191C24; --surface-2:#232733; --fg:#F2F3F7; --muted:#9BA1B3; --line:#2D323F;
  --rail:#0A0C10; --rail-2:#171A22; --rail-edge:#000; --logo:#FFFFFF;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 14px 40px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#191C24; --surface-2:#232733; --fg:#F2F3F7; --muted:#9BA1B3; --line:#2D323F;
  --rail:#0A0C10; --rail-2:#171A22; --rail-edge:#000; --logo:#FFFFFF;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 14px 40px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.c-berry{--c:var(--berry);--cd:var(--berry-d)} .c-sky{--c:var(--sky);--cd:var(--sky-d)}
.c-grape{--c:var(--grape);--cd:var(--grape-d)} .c-mint{--c:var(--mint);--cd:var(--mint-d)}

.app{height:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font:700 21px var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand .kron{width:36px;height:36px}
.top-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tm-row{display:flex;align-items:baseline;gap:10px}
.top-mid b{flex:1;min-width:0;font:700 15px/1.1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);position:relative;transition:width .7s cubic-bezier(.34,1.5,.64,1)}
.progress i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.count{font:600 14px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;color:var(--muted);transition:transform .08s}
.icon-btn:active{transform:translateY(2px);border-bottom-width:2px}
.icon-btn svg{width:20px;height:20px}

/* conveyor belt */
.belt-head,.tray-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);padding:0 4px}
.belt-head b,.tray-head b{font:600 13px var(--font-display);letter-spacing:.04em;color:var(--fg);margin-right:6px}
.linkish{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.belt{--cw:90px;position:relative;height:calc(var(--cw) + 30px);border-radius:22px;background:var(--rail);overflow:hidden;
  box-shadow:inset 0 -6px 0 var(--rail-edge), inset 0 2px 0 rgba(255,255,255,.06)}
.belt::before{content:"";position:absolute;left:0;right:0;top:12px;bottom:18px;
  background:repeating-linear-gradient(90deg,var(--rail-2) 0 16px,transparent 16px 32px);animation:tread 1.4s linear infinite;opacity:.9}
@keyframes tread{from{background-position:0 0}to{background-position:-32px 0}}
.roller{position:absolute;right:0;top:0;bottom:0;width:22px;z-index:3;background:linear-gradient(90deg,rgba(0,0,0,0),var(--rail-edge) 70%);}
.roller::after{content:"";position:absolute;right:6px;top:10px;bottom:16px;width:8px;border-radius:8px;background:repeating-linear-gradient(0deg,var(--rail-2) 0 6px,var(--rail) 6px 12px)}
.bcard{--y:0px;position:absolute;left:0;top:12px;width:var(--cw);height:var(--cw);border:none;border-radius:20px;padding:0;
  background:var(--c);border-bottom:5px solid var(--cd);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transform:translateX(var(--x,1000px)) translateY(var(--y));transition:transform .75s cubic-bezier(.34,1.25,.64,1), box-shadow .3s;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28)}
.bcard:hover{--y:-4px}
.bcard:active{--y:2px}
.bc-emoji{font-size:30px;line-height:1}
.bc-zh{max-width:88%;font:600 14px var(--font-ui);letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-dots{display:flex;gap:4px}.bc-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.8)}
.bcard.want{animation:want 1.6s ease-in-out infinite}
.bcard.want2{animation:want 0.9s ease-in-out infinite}
@keyframes want{0%,100%{box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 0 0 0 var(--c)}50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.28),0 0 0 4px #fff,0 0 0 8px var(--c)}}
.bcard.review::after{content:"复习";position:absolute;top:6px;right:6px;font:600 10px var(--font-ui);background:rgba(0,0,0,.22);padding:2px 6px;border-radius:99px}

/* stage */
.stage{flex:1;min-height:0;overflow:auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);
  padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.coach{display:flex;gap:10px;align-items:flex-end}
.coach .kron{width:62px;height:62px;flex:none}
.stage:has(.reveal) .coach{display:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface-2);border-radius:20px 20px 20px 6px;padding:10px 14px 11px;font-size:15px;line-height:1.55}
.bubble small{display:block;font:600 11.5px var(--font-display);letter-spacing:.08em;color:var(--kron-d);margin-bottom:1px}
.bubble.pop{animation:bubble .45s cubic-bezier(.34,1.6,.64,1)}
@keyframes bubble{from{transform:scale(.92) translateY(4px);opacity:.3}to{transform:none;opacity:1}}

.work{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:280px}
.meaning{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 10px;border-radius:99px;background:var(--surface-2)}
.meaning .m-emoji{font-size:28px;line-height:1}
.meaning b{font:600 22px var(--font-ui)}
.meaning .m-n{font-size:13px;color:var(--muted)}
.slots{display:flex;gap:10px;padding:14px 12px 12px;border-radius:22px;background:var(--surface-2);transition:gap .35s cubic-bezier(.34,1.4,.64,1),background .3s;position:relative}
.slot{min-width:76px;height:66px;border-radius:16px;border:2.5px dashed color-mix(in oklab,var(--c) 45%,var(--line));display:flex;transition:border-color .2s}
.slot:has(.brick){border-color:transparent}
.slots.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots.merged{gap:0;background:transparent}
.slots.merged .slot{min-width:0}
.slots.merged .brick{border-radius:0;transition:border-radius .3s}
.slots.merged .slot:first-child .brick{border-radius:16px 0 0 16px}
.slots.merged .slot:last-child .brick{border-radius:0 16px 16px 0}
.slots.merged .slot+.slot .brick{box-shadow:inset 0 3px 0 rgba(255,255,255,.3), inset 2px 0 0 rgba(255,255,255,.18)}
.slots.merged::after{content:"";position:absolute;inset:14px 12px 12px;border-radius:16px;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:shine .9s .15s ease-out both}
@keyframes shine{from{background-position:130% 0}to{background-position:-60% 0}}
.slots.merged{animation:jump .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes jump{40%{transform:translateY(-10px) scale(1.05)}}

.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 12px;max-width:460px;transition:opacity .3s}
.cell{height:66px;border-radius:16px;background:var(--surface-2);display:flex}
.brick{position:relative;min-width:76px;height:66px;padding:0 18px;border:none;border-radius:16px;background:var(--c);border-bottom:6px solid var(--cd);
  color:#fff;font:600 28px var(--font-display);letter-spacing:.01em;text-shadow:0 1px 0 rgba(0,0,0,.14);box-shadow:inset 0 3px 0 rgba(255,255,255,.3);
  transition:transform .08s, border-bottom-width .08s}
.brick::before,.brick::after{content:"";position:absolute;top:-7px;width:16px;height:9px;border-radius:6px 6px 2px 2px;background:var(--c);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.brick::before{left:14px}.brick::after{right:14px}
.brick:active{transform:translateY(3px);border-bottom-width:3px}
.pool .brick{animation:in .5s cubic-bezier(.34,1.6,.64,1) both;animation-delay:calc(var(--i) * 60ms + 200ms)}
@keyframes in{from{transform:scale(.4) translateY(14px);opacity:0}}
.brick.ping{animation:ping .4s cubic-bezier(.34,1.8,.64,1)}
@keyframes ping{30%{transform:scale(1.12) rotate(-3deg)}}
.work.done .pool,.work.done .actions{opacity:0;pointer-events:none}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;transition:opacity .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 16px var(--font-display);letter-spacing:.02em;padding:12px 20px;border-radius:16px;
  border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--muted);transition:transform .08s}
.btn svg{width:18px;height:18px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--ok);border-color:var(--ok-d);color:#fff;text-transform:uppercase;letter-spacing:.06em}
.btn.wide{width:100%;padding:15px}

/* idle */
.work.idle{color:var(--muted);text-align:center;gap:8px}
.idle-art{width:64px;height:64px;color:var(--kron);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.idle-t{margin:0;font:600 20px var(--font-display);color:var(--fg)}
.idle-s{margin:0;font-size:14px;max-width:30ch;line-height:1.5}

/* reveal */
.reveal{width:100%;display:grid;gap:14px;animation:rise .55s cubic-bezier(.34,1.35,.64,1)}
@keyframes rise{from{transform:translateY(24px) scale(.97);opacity:0}}
.scene{position:relative;aspect-ratio:16/8;max-width:100%;border-radius:22px;overflow:hidden;
  background:linear-gradient(165deg,color-mix(in oklab,var(--c) 42%,var(--surface)),color-mix(in oklab,var(--c) 14%,var(--surface)))}
.scene::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-38%;height:62%;border-radius:50%;background:color-mix(in oklab,var(--c) 30%,var(--surface))}
.scene-emoji{position:absolute;right:16%;top:50%;font-size:clamp(56px,14vw,86px);line-height:1;transform:translateY(-50%);animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.15))}
@keyframes float{50%{transform:translateY(calc(-50% - 10px)) rotate(6deg)}}
.scene .kron{position:absolute;left:10%;bottom:-6%;width:clamp(90px,26%,140px);height:auto;transform:rotate(-6deg)}
@keyframes peek{from{transform:translateY(60%) rotate(-6deg)}}
.scene-tag{position:absolute;right:10px;top:10px;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.7);color:#3a3d48}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(.4);opacity:.2}}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rv-word{font:700 clamp(36px,9vw,48px)/1 var(--font-display);letter-spacing:-.01em;display:flex;align-items:baseline;flex-wrap:wrap;min-width:0}
.rv-word i{font-style:normal;color:var(--c);margin:0 .06em;opacity:.8}
.rv-meta{display:flex;gap:12px;align-items:baseline;color:var(--muted);font-size:15px;margin-top:-6px}
.rv-meta .zh{color:var(--fg);font-weight:600}
.round{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:none;background:var(--c);border-bottom:4px solid var(--cd);color:#fff}
.round svg{width:24px;height:24px}
.round.sm{width:40px;height:40px}.round.sm svg{width:18px;height:18px}
.round:active{transform:translateY(2px);border-bottom-width:2px}
.rv-sent{display:flex;gap:12px;align-items:center;padding:12px 12px 12px 16px;border-radius:18px;background:var(--surface-2)}
.rv-sent div{flex:1;min-width:0}
.rv-sent small{display:block;font:600 11.5px var(--font-display);letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.rv-sent p{margin:0;font:500 19px/1.45 var(--font-display)}
.rv-sent.long p{font-size:16px}.rv-sent.long p.sc{font-size:13px}
.rv-sent p.sc{font:400 14px/1.5 var(--font-ui);color:var(--muted);margin-top:4px}
.scene.photo{aspect-ratio:auto;background:var(--surface-2)}.scene.photo::before{display:none}
.scene.photo img{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain}
.bc-img{width:78%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.m-img{height:40px;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.bk-img.gen{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14% 12%;background:var(--b);color:#fff;text-align:left}
.bk-img.gen small{font:600 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.bk-img.gen b{font:700 clamp(17px,2.6vw,26px)/1.15 var(--font-display);overflow-wrap:anywhere}
.rv-sent mark{background:color-mix(in oklab,var(--c) 22%,transparent);color:inherit;border-radius:6px;padding:0 2px;font-weight:700}

/* tray */
.tray{display:grid;grid-template-columns:repeat(var(--n,6),1fr);gap:8px;padding:10px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.tslot{position:relative;aspect-ratio:1/1.08;border-radius:14px;background:var(--surface-2)}
.tslot.over{background:color-mix(in oklab,var(--bad) 20%,var(--surface-2))}
.tray.warn .tslot:not(:has(.tcard)){box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--bad) 55%,transparent)}
.tcard{position:absolute;inset:0;border-radius:14px;background:var(--c);border-bottom:4px solid var(--cd);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3);overflow:hidden}
.tc-e{font-size:clamp(18px,5vw,24px);line-height:1}
.tc-w{font:600 clamp(10px,2.6vw,12.5px) var(--font-display);max-width:100%;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:6px solid var(--c);pointer-events:none;z-index:60;animation:ring .55s ease-out forwards}
@keyframes ring{to{transform:scale(9);opacity:0;border-width:1px}}

/* toast, sheets */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:80;max-width:min(92vw,440px);
  background:var(--fg);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:14px;transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.toast.show{transform:translate(-50%,0)}
.toast:empty{display:none}
.combo{position:fixed;z-index:70;pointer-events:none;font:700 30px var(--font-display);color:var(--fg);text-shadow:0 2px 0 var(--surface);animation:combo 1s ease-out forwards}
@keyframes combo{0%{transform:translate(-50%,0) scale(.5);opacity:0}25%{transform:translate(-50%,-30px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.backdrop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(10,12,20,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,430px);max-height:100%;overflow:auto;background:var(--surface);border-radius:28px;padding:22px;display:grid;gap:16px;animation:pop .45s cubic-bezier(.34,1.5,.64,1)}
@keyframes pop{from{transform:scale(.88) translateY(20px);opacity:0}}
.sheet h2{margin:0;font:700 24px var(--font-display);text-wrap:balance}
.sheet .sub{margin:-10px 0 0;color:var(--muted);font-size:14px}
.field-label{font:600 12px var(--font-display);letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.books{display:grid;gap:8px}
.book{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface)}
.book[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in oklab,var(--sky) 10%,var(--surface))}
.book .bk-ic{font-size:26px}.book b{display:block;font-size:15px}.book span{font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px 0;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font:600 18px var(--font-display);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok-d);background:color-mix(in oklab,var(--ok) 10%,var(--surface))}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.toggle-row{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.switch{width:52px;height:32px;border-radius:99px;border:none;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.34,1.5,.64,1)}
.switch[aria-checked="true"]{background:var(--ok)}.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;border:2px solid var(--line);padding:10px;text-align:center}
.stat b{display:block;font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* bookshelf */
.book .bk-mini{flex:none;width:36px;height:auto;border-radius:3px 5px 5px 3px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.book{width:100%}.book .chev{margin-left:auto;font-size:22px;color:var(--muted)}
/* home: Apple Books style storefront */
.home{--hb:var(--bg);--hs:var(--muted);--hl:var(--line);--hp:var(--surface-2);--hbar:color-mix(in oklab,var(--bg) 84%,transparent);--hk:var(--fg);--hk-fg:var(--bg);
  position:fixed;inset:0;z-index:95;background:var(--hb);color:var(--hk);overflow-y:auto;overflow-x:hidden;font-family:var(--font-ui);animation:fade .3s}
.home.out{animation:fadeOut .26s forwards}
@keyframes fadeOut{to{opacity:0}}
/* 右上角「邀请」+「登录」，和 Kron Aha 首页一样 */
.hm-acts{display:flex;align-items:center;gap:8px;flex:none}
.hm-invite,.hm-me{padding:7px 14px;border-radius:999px;font:600 14px/1.2 var(--font-ui);text-decoration:none;white-space:nowrap}
.hm-invite{background:var(--hk);color:var(--hk-fg)}
.hm-me{background:var(--hp);color:var(--hs);font-variant-numeric:tabular-nums}
.hm-bar{position:sticky;top:0;z-index:3;background:var(--hbar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding-top:env(safe-area-inset-top)}
.hm-bar .in{max-width:620px;margin:0 auto;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,env(safe-area-inset-left,0px))}
.hm-bar .brand span{display:inline}
.hm-tabs{display:flex;padding:32px 16px 0;overflow-x:auto;scrollbar-width:none;animation:hmUp .7s cubic-bezier(.2,.8,.2,1) .05s both}
.hm-tabs::-webkit-scrollbar{display:none}
.pills{position:relative;display:inline-flex;flex:none;margin:0 auto;padding:5px;border-radius:99px;background:var(--hp)}
.pills button{position:relative;z-index:1;border:0;background:none;padding:10px 20px;border-radius:99px;font:600 16px var(--font-display);letter-spacing:.01em;color:var(--hk);white-space:nowrap;transition:color .35s}
.pills button[aria-pressed="true"]{color:#fff}
.pills .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:99px;background:var(--ok);box-shadow:inset 0 -3px 0 var(--ok-d);transition:transform .45s cubic-bezier(.3,1.2,.5,1),width .45s cubic-bezier(.3,1.2,.5,1)}
.hm-rows{display:flex;flex-direction:column;gap:40px;padding:44px 0 150px}
.hm-rows.swap{animation:hmSwap .5s cubic-bezier(.2,.8,.2,1)}
.mq{--h:230px;overflow:hidden;animation:hmIn .9s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.mq.big{--h:290px}
.mq-track{display:flex;width:max-content;animation:mq var(--dur,60s) linear var(--off,0s) infinite}
.home.hold .mq-track,.mq:hover .mq-track{animation-play-state:paused}

@keyframes hmUp{from{opacity:0;transform:translateY(14px)}}
@keyframes hmSwap{from{opacity:0;transform:translateY(16px)}}
.hb{flex:none;margin-right:22px;border:0;padding:0;background:none;text-align:left;color:var(--hk);cursor:pointer;width:calc(var(--h) * var(--ar))}
.hb .cov{position:relative;height:var(--h);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.hb:hover .cov{transform:translateY(-6px)}
.hb:active .cov{transform:scale(.97)}
.hb .bk-img{width:100%;height:100%;object-fit:cover;border-radius:4px 8px 8px 4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 24px -10px rgba(0,0,0,.35)}
.hb.out .cov{opacity:0}
.hb b{display:block;margin-top:12px;font:600 19px/1.25 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb small{display:block;margin-top:2px;font:400 15px/1.3 var(--font-ui);color:var(--hs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pg{display:block;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.pg i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.hb .pg{width:100%}
.hm-go .pg{max-width:200px}
.win-pg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;font-size:13px;color:var(--muted)}

.bk-back li button.on em s{color:#fff}
.auto-go{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.auto-go i{display:block;height:100%;width:0;border-radius:9px;background:var(--ok)}
.reveal{cursor:pointer}
.hm-go img{flex:none;height:52px;width:auto;border-radius:3px 5px 5px 3px;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.hm-go span{flex:1;min-width:0;display:flex;flex-direction:column}
.hm-go small{font-size:13px;color:var(--hs)}
.hm-go b{font:600 18px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-go em{font-style:normal;flex:none;padding:12px 24px;border-radius:16px;background:var(--ok);border-bottom:4px solid var(--ok-d);color:#fff;font:600 16px var(--font-display);letter-spacing:.06em}

.bk-front,.bk-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5px 12px 12px 5px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.35)}

.bk-back li button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 18px;border:0;background:none;text-align:left;color:var(--fg);border-bottom:1px solid var(--line)}
.bk-back li:last-child button{border-bottom:0}
.bk-back li button i{font-style:normal;width:18px;color:var(--muted);font:600 13px var(--font-display);font-variant-numeric:tabular-nums}
.bk-back li button span{flex:1;min-width:0;display:flex;flex-direction:column}
.bk-back li button b{font:700 15px var(--font-display)}

.bk-back li button.on{background:var(--b);color:#fff}.bk-back li button.on i,.bk-back li button.on small,.bk-back li button.on em{color:rgba(255,255,255,.85)}
/* blind boxes after a round */
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 0 2px}
.gbox{position:relative;border:0;background:none;padding:0;height:128px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;
  animation:boxDrop .7s cubic-bezier(.34,1.6,.64,1) var(--d) both}

  box-shadow:inset 0 0 0 0 transparent;transition:transform .2s}

.boxes:not(.picked) .gbox{animation:boxDrop .7s cubic-bezier(.34,1.6,.64,1) var(--d) both,boxIdle 2.4s ease-in-out calc(var(--d) + .8s) infinite}
.boxes:not(.picked) .gbox:hover .gb-body,.boxes:not(.picked) .gbox:active .gb-body{transform:translateY(2px)}
.gbox.chosen{animation:boxShake .5s ease-in-out both;z-index:2}
.gbox.open .gb-lid{transform:translate(-18px,-40px) rotate(-38deg);opacity:0}
.gbox.open .gb-name{transform:translate(-50%,-62px) scale(1);opacity:1}

.boxes.picked .gbox:not(.chosen){opacity:.45;filter:saturate(.6);transition:opacity .4s,filter .4s}
.gbox.chosen.open .gb-body{transform:scale(1.06)}

function initKronHeads(root = document) {
  root.querySelectorAll("svg.kron-head:not([data-kh])").forEach(svg => {
    svg.setAttribute("data-kh", "1");
    const HX=256, HY=191, K=150, ZE=0.30, STAG=42, KICK=190, D=2*ZE*Math.sqrt(K);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const qs=[...svg.querySelectorAll(".quill")].map(el=>{
      const cx=+el.dataset.cx, cy=+el.dataset.cy, ry=+el.dataset.ry, rest=+el.dataset.rest, a=rest*Math.PI/180;
      const e1={x:cx-ry*Math.sin(a), y:cy+ry*Math.cos(a)}, e2={x:cx+ry*Math.sin(a), y:cy-ry*Math.cos(a)};
      const b = Math.hypot(e1.x-HX,e1.y-HY) < Math.hypot(e2.x-HX,e2.y-HY) ? e1 : e2;
      return {el,cx,cy,rest,bx:b.x,by:b.y,th:0,om:0,kickAt:0,kicked:true,order:0};
    });
    qs.slice().sort((p,q)=>p.cx-q.cx).forEach((p,i)=>p.order=i);
    let last=performance.now();
    function trigger(p=1){ const now=performance.now(); qs.forEach(q=>{ q.kickAt=now+q.order*STAG; q.kicked=false; q.kp=p; }); }
    svg._kick=trigger; svg.style.cursor="pointer";
    svg.addEventListener("click",e=>{ e.stopPropagation(); trigger(); });
    if(svg.closest('.win-kron')){const iv=setInterval(()=>{if(!svg.isConnected)return clearInterval(iv);trigger(.8)},1600)}
    function frame(t){
      if(!svg.isConnected) return;
      let dt=(t-last)/1000; last=t; if(dt>0.05)dt=0.05;
      const sub=5, h=dt/sub;
      for(const q of qs){
        if(!q.kicked && t>=q.kickAt){ q.om+=-KICK*(q.kp||1); q.kicked=true; }
        for(let s=0;s<sub;s++){ const f=-K*q.th - D*q.om; q.om+=f*h; q.th+=q.om*h; }
        const breeze = reduce?0:0.85*Math.sin(t/950 + q.order*0.6);
        q.el.setAttribute("transform","rotate("+(q.th+breeze).toFixed(2)+" "+q.bx.toFixed(1)+" "+q.by.toFixed(1)+") rotate("+q.rest+" "+q.cx+" "+q.cy+")");
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if(!reduce) trigger();
  });
}

function clip(name){return CLIPS[name]||(CLIPS[name]=fetch(`${name.includes('/')?'':'audio/'}${name}.mp3`).then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,no)=>ac().decodeAudioData(b,ok,no))).catch(()=>null))}

/* ---------- particles ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],running=false;
function sizeCanvas(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}

function burst(x,y,colors,n=36,power=1){if(reduced)n=Math.min(n,10);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(3+Math.random()*6)*power;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*power,r:3+Math.random()*5,c:colors[i%colors.length],life:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4,sh:i%3})}
  if(!running){running=true;requestAnimationFrame(loop)}}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);for(const p of parts){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.life-=.015;p.rot+=p.vr;
  cx.save();cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.translate(p.x,p.y);cx.rotate(p.rot);
  if(p.sh===0){cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}else if(p.sh===1){cx.fillRect(-p.r,-p.r/2,p.r*2,p.r)}else{cx.beginPath();cx.roundRect?cx.roundRect(-p.r,-p.r,p.r*2,p.r*2,p.r*.5):cx.rect(-p.r,-p.r,p.r*2,p.r*2);cx.fill()}cx.restore()}
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}}

async function newGame(autoPick){
  const pool=await unitPool(),max=pool.length-pool.length%3,n=Math.min(S.count,max);
  const off=(PROG[S.pick.bk]||{})[S.pick.u]||0;  // walk through the unit in order, a round at a time
  const picked=Array.from({length:n},(_,i)=>pool[(off+i)%pool.length]);const cols=shuffle(COLORS);
  const items=picked.map((w,i)=>({id:'k'+Date.now().toString(36)+i,w,color:cols[Math.floor(i/3)%cols.length],review:false}));
  Object.assign(S,{live:true,round:picked,queue:shuffle(items),tray:[],cleared:0,total:n,current:null,mistakes:0,solved:0,listens:0,t0:Date.now(),popCombo:0,busy:false,locked:false});
  $('#bookName').textContent=pickTitle();
  document.querySelectorAll('#belt .bcard').forEach(el=>el.remove());
  renderBelt(true);renderTray();setProgress();idle(true);
  if(autoPick)setTimeout(()=>{const first=S.queue[0];const el=first&&$(`#belt [data-id="${first.id}"]`);if(el&&!S.current)pick(first,el,true)},Math.min(S.queue.length,6)*110+900);
}

function beltMetrics(){const belt=$('#belt');const W=belt.clientWidth;const cw=parseFloat(getComputedStyle(belt).getPropertyValue('--cw'))||90;const gap=10,pad=12;
  return{W,cw,gap,pad,vis:Math.max(3,Math.floor((W-pad*2-14+gap)/(cw+gap)))}}
function renderBelt(feed){
  const belt=$('#belt'),m=beltMetrics();
  belt.querySelectorAll('.bcard').forEach(el=>{if(!S.queue.some(q=>q.id===el.dataset.id))el.remove()});
  S.queue.forEach((it,i)=>{
    let el=belt.querySelector(`[data-id="${it.id}"]`);
    if(!el){el=makeBeltCard(it);el.style.setProperty('--x',(m.W+30)+'px');belt.insertBefore(el,belt.querySelector('.roller'));void el.offsetWidth}
    el.classList.toggle('review',it.review);
    const x=i<m.vis?m.pad+i*(m.cw+m.gap):m.W+30+(i-m.vis)*(m.cw+m.gap);
    el.style.transitionDelay=feed?(Math.min(i,m.vis)*110)+'ms':'0ms';
    el.style.setProperty('--x',x+'px');el.tabIndex=i<m.vis?0:-1;
  });
  if(feed)setTimeout(()=>belt.querySelectorAll('.bcard').forEach(el=>el.style.transitionDelay='0ms'),1400);

  const last=S.saved&&findBook(S.pick.bk),lu=last&&last.b.units[S.pick.u];
  v.innerHTML=`<header class="hm-bar"><div class="in"><div class="brand">${KRON_LOGO}<span>Kron Word</span></div><div class="hm-acts"><a class="hm-invite" href="https://kronenglish.pages.dev/invite" title="邀请朋友，你们俩都多 3 天全部课程">邀请</a><a class="hm-me" href="/login/">登录</a></div></div></header>
    <nav class="hm-tabs"><div class="pills"><i class="ind"></i>${HOME_TABS.map(([id,n])=>`<button data-tab="${id}">${n}</button>`).join('')}</div></nav>
    <div class="hm-rows"></div>
    ${last?`<button class="hm-go" data-sh="go"><img src="covers/${last.b.id}.jpg" alt=""><span><small>继续上次</small><b>${pickTitle()}</b><span class="pg"><i style="width:${bookDone(last.b.id)/bookWords(last.b)*100}%"></i></span></span><em>继续</em></button>`:''}`;
  document.body.appendChild(v);drawHomeRows(v,tab);
  fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{const m=v.querySelector('.hm-me');if(d&&d.authenticated&&m)m.textContent=d.user.phone||d.user.displayName}).catch(()=>{});
  v.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-sh],.hb');if(!t)return;
    if(t.dataset.tab){if(t.dataset.tab!==tab){tab=t.dataset.tab;drawHomeRows(v,tab,true)}return}
    const a=t.dataset.sh;
    if(a==='go'){sfx.ding();closeHome();if(!S.live)newGame(true);return}
    pullBook(t)});
  let rt;v._rs=()=>{clearTimeout(rt);rt=setTimeout(()=>drawHomeRows(v,tab),200)};addEventListener('resize',v._rs);
}
function closeHome(){const v=$('#shelf');if(!v)return;removeEventListener('resize',v._rs);v.classList.add('out');setTimeout(()=>v.remove(),260)}
function pullBook(btn){
  if($('#bkStage'))return;const f=findBook(btn.dataset.bk),r=(btn.querySelector('.bk-img')||btn).getBoundingClientRect(),hm=$('#shelf');hm&&hm.classList.add('hold');
  let H=Math.min(470,innerHeight-120),W=H*f.ar;if(W>innerWidth-48){W=innerWidth-48;H=W/f.ar}const L=(innerWidth-W)/2,T=(innerHeight-H)/2;
  const st=document.createElement('div');st.className='bk-stage';st.id='bkStage';
  const curU=S.pick.bk===f.b.id?S.pick.u:-1;
  st.innerHTML=`<div class="bk-fly" style="left:${L}px;top:${T}px;width:${W}px;height:${H}px"><div class="bk-flip"><div class="bk-front">${coverHTML(f)}</div>
    <div class="bk-back" style="--b:var(--ok)"><header><b>${bkName(f)}</b></header><ol>${f.b.units.map((u,k)=>`<li><button data-u="${k}" class="${k===curU?'on':''}"><i>${k+1}</i><span><b>${u[0].replace('Welcome Unit','Welcome')}</b>${u[1]?`<small>${u[1]}</small>`:''}</span><em>${(d=>d>=u[2]?'<s>✓</s>':d?d+'/'+u[2]:u[2])(unitDone(f.b.id,k))}</em></button></li>`).join('')}</ol></div></div></div>`;
  document.body.appendChild(st);btn.classList.add('out');
  const fly=st.querySelector('.bk-fly');
  const home=()=>`translate(${r.left-L}px,${r.top-T}px) scale(${r.width/W},${r.height/H})`;
  fly.style.transform=home();fly.getBoundingClientRect();
  requestAnimationFrame(()=>{st.classList.add('in');fly.style.transform='none'});sfx.whoosh();
  setTimeout(()=>st.classList.add('flipped'),reduced?0:430);
  const putBack=()=>{st.classList.remove('flipped');setTimeout(()=>{st.classList.remove('in');fly.style.transform=home();setTimeout(()=>{btn.classList.remove('out');st.remove();hm&&hm.classList.remove('hold')},420)},reduced?0:380)};
  st.addEventListener('click',e=>{const u=e.target.closest('[data-u]');
    if(u){u.classList.add('on');sfx.ding();S.pick={bk:f.b.id,u:+u.dataset.u};S.book=sampleFor(f.b.id);savePrefs();
      setTimeout(()=>{st.remove();closeHome();newGame(true)},320);return}
    if(!e.target.closest('.bk-back'))putBack()});
}
$('#openSettings').onclick=openSettings;$('#goHome').onclick=openHome;
addEventListener('resize',()=>{sizeCanvas();renderBelt()});

openHome();
</script>
